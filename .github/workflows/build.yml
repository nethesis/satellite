name: Build and Publish Container

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nethvoice_ref:
        description: Companion NethVoice revision for contract tests
        required: false
        default: voice_agents

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: satellite

      - name: Checkout companion contracts
        uses: actions/checkout@v7
        with:
          repository: nethesis/ns8-nethvoice
          ref: ${{ inputs.nethvoice_ref || ((github.head_ref || github.ref_name) == 'voice_agents_attended_transfer' && 'voice_agents_attended_transfer' || (github.ref_name == 'main' && 'main' || 'voice_agents')) }}
          path: ns8-nethvoice

      - name: Set up PHP contract validator
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sodium
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            satellite/requirements.txt
            satellite/requirements-agent.lock
            satellite/requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            python3-dev \
            portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.lock
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
